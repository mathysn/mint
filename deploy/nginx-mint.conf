# Only if nginx already uses ports 80/443 on the server (then COMPOSE_PROFILES is empty in .env
# and Caddy doesn't start). Copy to /etc/nginx/sites-available/mint, replace the domain, link it in
# sites-enabled, `nginx -t && systemctl reload nginx` (reload, not restart: other sites stay up),
# then get the certificate: certbot --nginx -d mint.example.com
server {
    listen 80;
    server_name mint.example.com;

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Set, never append: the app trusts the first address (guest limits, same-IP signal).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }
}
