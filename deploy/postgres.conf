# Postgres for Mint on a small shared server (the Discord bots keep their share of memory).
# The container is capped by PG_MEM_LIMIT (docker-compose.yml); these values fit in ~640 MB.
# Only reachable on the private Docker network: Postgres is never published to the internet.
listen_addresses = '*'
max_connections = 30

shared_buffers = 160MB
effective_cache_size = 400MB
work_mem = 4MB
maintenance_work_mem = 64MB

wal_buffers = 8MB
checkpoint_completion_target = 0.9
max_wal_size = 1GB
min_wal_size = 80MB

random_page_cost = 1.1
effective_io_concurrency = 200

timezone = 'UTC'
log_timezone = 'UTC'
log_min_duration_statement = 1000
log_lock_waits = on
