<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mint — Album (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0B0D}
a{color:#ECEDEF}a:hover{color:#FFFFFF}
.mono{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-variant-numeric:tabular-nums}
.lbl{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#858B94}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0A0B0D; color: #ECEDEF; font-family: 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif">

<div style="position: absolute; left: 0; right: 0; top: 0; bottom: 84px; overflow-y: auto; box-sizing: border-box; padding-top: 50px">

<header style="display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 20px">
<a href="Mobile-Home.dc.html" aria-label="Mint, home" style="display: flex; align-items: center; gap: 10px; height: 44px; text-decoration: none; color: #ECEDEF">
<span aria-hidden="true" style="width: 14px; height: 14px; background: #ECEDEF; clip-path: polygon(0 0, 100% 0, 100% 62%, 62% 100%, 0 100%)"></span>
<span class="mono" style="font-size: 14px; font-weight: 600; letter-spacing: 0.34em">MINT</span>
</a>
<span class="mono" style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid #2C3138; border-radius: 2px; font-size: 13px">4,870 <span style="color: #A1A7AF">CR</span></span>
</header>

<div style="display: flex; flex-direction: column; gap: 18px; padding: 12px 20px 32px">
<button type="button" aria-haspopup="listbox" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0; border: 0; background: none; color: #A1A7AF; font: inherit; font-size: 14px">
<span class="lbl">// Album</span><span>· 6 albums</span>
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 2"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<h1 style="margin: -10px 0 0; font-size: 30px; line-height: 1.05; font-weight: 600; letter-spacing: -0.02em">The Kilowatt Collection</h1>
<div style="display: flex; align-items: baseline; justify-content: space-between">
<span class="mono" style="font-size: 36px; font-weight: 500; letter-spacing: -0.02em">11<span style="color: #5A616B"> / 17</span></span>
<span class="mono" style="font-size: 15px; color: #A1A7AF">65%</span>
</div>
<div aria-hidden="true" style="display: flex; gap: 2px; height: 6px">
<sc-for list="{{segments}}" as="s" hint-placeholder-count="17"><span style="flex: 1 1 0; background: {{s.bg}}"></span></sc-for>
</div>
<ul style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px">
<sc-for list="{{summary}}" as="s" hint-placeholder-count="4">
<li style="display: flex; align-items: center; gap: 8px; font-size: 13px"><span aria-hidden="true" style="width: 8px; height: 8px; background: {{s.color}}"></span><span style="color: #A1A7AF">{{s.name}}</span><span class="mono" style="margin-left: auto">{{s.have}}/{{s.total}}</span></li>
</sc-for>
</ul>
<div role="group" aria-label="Show" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button type="button" aria-pressed="true" style="height: 40px; border: 1px solid #ECEDEF; border-radius: 2px; background: #ECEDEF; color: #0A0B0D; font: inherit; font-size: 13px; font-weight: 500">All</button>
<button type="button" aria-pressed="false" style="height: 40px; border: 1px solid #2C3138; border-radius: 2px; background: transparent; color: #A1A7AF; font: inherit; font-size: 13px; font-weight: 500">Missing only</button>
</div>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<section aria-label="{{g.name}}" style="display: flex; flex-direction: column; gap: 10px; padding-top: 6px">
<div style="display: flex; align-items: center; gap: 8px">
<span aria-hidden="true" style="width: 8px; height: 8px; background: {{g.color}}"></span>
<h2 style="margin: 0; font-size: 13px; font-weight: 600; color: {{g.text}}">{{g.name}}</h2>
<span aria-hidden="true" style="flex: 1; height: 1px; background: #1A1D22"></span>
<span class="mono" style="font-size: 11px; color: #858B94">{{g.have}}/{{g.total}}</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; border-radius: 4px; overflow: hidden; {{it.frame}}">
<div style="position: relative; height: 88px; display: grid; place-items: center">
<sc-if value="{{it.owned}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="position: absolute; inset: 10% 12%; background: radial-gradient(closest-side, {{it.glow}}, rgba(0,0,0,0))"></span></sc-if>
<svg role="img" aria-label="{{it.full}}{{it.a11y}}" viewBox="0 0 240 100" style="position: relative; width: 80%; fill: {{it.fill}}"><path d="{{it.art}}"></path></svg>
</div>
<div style="padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 11px; color: #A1A7AF">{{it.weapon}}</span>
<span style="font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: {{it.nameColor}}">{{it.skin}}</span>
<span class="mono" style="margin-top: 3px; font-size: 10px; color: #858B94">{{it.note}}</span>
</div>
<span aria-hidden="true" style="height: 3px; background: {{it.bar}}"></span>
</div>
</sc-for>
</div>
</section>
</sc-for>
</div>
</div>

<nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 6px 6px 24px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #0D0E11; border-top: 1px solid #1C1F24">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<a href="{{t.href}}" aria-current="{{t.current}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 50px; text-decoration: none; font-size: 11px; font-weight: 500; color: {{t.color}}">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round"><path d="{{t.icon}}"></path></svg>
<span>{{t.label}}</span>
</a>
</sc-for>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const ART = {
  rifle: 'M10 46L58 38L60 52L18 66Q10 67 10 60Z M56 35H150V52H56Z M70 30H140V35H70Z M150 38H196V50H150Z M196 42H232V46H196Z M186 32H191V38H186Z M112 52H128Q131 68 140 82L124 86Q116 70 112 52Z M80 52H94L88 76H76Z',
  sniper: 'M8 50L60 44L62 58L32 60L16 72Q8 73 8 66Z M58 44H150V56H58Z M150 47H234V51H150Z M80 30H132V40H80Z M70 27H82V43H70Z M130 28H142V42H130Z M96 40H102V44H96Z M112 40H118V44H112Z M76 56H90L84 78H72Z M110 56H124V70H110Z',
  pistol: 'M70 30H182V46H70Z M74 46H176V54H120V58H74Z M76 54H108L100 88Q99 92 94 92H70Q64 92 66 86Z M108 56Q110 68 122 68V64Q114 64 112 56Z M182 34H188V42H182Z',
  smg: 'M60 36H160V54H60Z M160 42H200V47H160Z M20 40H60V44H28V56H60V60H20Z M118 54H132L134 90H120Z M76 54H90L84 78H72Z M70 31H80V36H70Z'
};
const RAR = {
  covert: { name: 'Covert', color: '#EB4B4B', text: '#F27D7D', glow: 'rgba(235,75,75,0.32)', dim: 'rgba(235,75,75,0.30)' },
  classified: { name: 'Classified', color: '#D32CE6', text: '#E57AF0', glow: 'rgba(211,44,230,0.30)', dim: 'rgba(211,44,230,0.30)' },
  restricted: { name: 'Restricted', color: '#8847FF', text: '#A983FF', glow: 'rgba(136,71,255,0.32)', dim: 'rgba(136,71,255,0.30)' },
  milspec: { name: 'Mil-Spec', color: '#4B69FF', text: '#8197FF', glow: 'rgba(75,105,255,0.30)', dim: 'rgba(75,105,255,0.30)' }
};
const ALBUM = {
  covert: [['AK-47', 'Inheritance', 'rifle', 'FT 0.2381'], ['AWP', 'Chrome Cannon', 'sniper', 'ST™ MW 0.0934']],
  classified: [['M4A1-S', 'Black Lotus', 'rifle', 'FN 0.0512'], ['USP-S', 'Jawbreaker', 'pistol', 'WW 0.4012'], ['Zeus x27', 'Olympus', 'pistol', null]],
  restricted: [['Glock-18', 'Block-18', 'pistol', 'ST™ FT 0.1876'], ['M4A4', 'Etch Lord', 'rifle', 'MW 0.1287'], ['Five-SeveN', 'Hybrid', 'pistol', null], ['MP7', 'Just Smile', 'smg', null], ['Sawed-Off', 'Analog Input', 'rifle', null]],
  milspec: [['SSG 08', 'Dezastre', 'sniper', 'ST™ FN 0.0402'], ['Nova', 'Dark Sigil', 'rifle', 'MW 0.0812'], ['XM1014', 'Irezumi', 'rifle', 'FT 0.2004'], ['MAC-10', 'Light Box', 'smg', 'FT 0.3121'], ['Tec-9', 'Slag', 'pistol', 'BS 0.6188'], ['Dual Berettas', 'Hideout', 'pistol', null], ['UMP-45', 'Motorized', 'smg', null]]
};
class Component extends DCLogic {
  renderVals() {
    const order = ['covert', 'classified', 'restricted', 'milspec'];
    const groups = order.map((k) => {
      const r = RAR[k];
      return {
        name: r.name, color: r.color, text: r.text,
        have: ALBUM[k].filter((e) => !!e[3]).length, total: ALBUM[k].length,
        items: ALBUM[k].map((e) => {
          const owned = !!e[3];
          return {
            weapon: e[0], skin: e[1], full: e[0] + ' | ' + e[1], art: ART[e[2]], owned, glow: r.glow,
            note: owned ? 'Best ' + e[3] : 'Not collected',
            a11y: owned ? '' : ', not collected yet',
            fill: owned ? '#D3D6DB' : '#262A30',
            nameColor: owned ? '#ECEDEF' : '#858B94',
            bar: owned ? r.color : r.dim,
            frame: owned ? 'background: #0E1013; border: 1px solid #1C1F24' : 'background: #0B0C0E; border: 1px dashed #2C3138'
          };
        })
      };
    });
    const segments = [];
    order.forEach((k) => ALBUM[k].forEach((e) => segments.push({ bg: e[3] ? RAR[k].color : '#1E2227' })));
    const summary = order.map((k) => ({ name: RAR[k].name, color: RAR[k].color, have: ALBUM[k].filter((e) => !!e[3]).length, total: ALBUM[k].length }));
    const tabs = [
      ['home', 'Home', 'Mobile-Home.dc.html', 'M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z'],
      ['cases', 'Cases', 'Mobile-Cases.dc.html', 'M3 8h18v12H3zM3 12h18M10 12v3h4v-3M8 8V5h8v3'],
      ['inventory', 'Inventory', 'Mobile-Inventory.dc.html', 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z'],
      ['albums', 'Albums', 'Mobile-Album.dc.html', 'M8 3h12v14H8zM4 7v14h12'],
      ['more', 'More', 'Mobile-More.dc.html', 'M4 6h16M4 12h16M4 18h16']
    ].map((t) => ({ label: t[1], href: t[2], icon: t[3], current: t[0] === 'albums' ? 'page' : undefined, color: t[0] === 'albums' ? '#ECEDEF' : '#858B94' }));
    return { groups, segments, summary, tabs };
  }
}
</script>
</body>
</html>
