<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mint — Cases (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0B0D}
a{color:#ECEDEF}a:hover{color:#FFFFFF}
.mono{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-variant-numeric:tabular-nums}
.lbl{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#858B94}
.hscroll{scrollbar-width:none}.hscroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0A0B0D; color: #ECEDEF; font-family: 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif">

<div style="position: absolute; left: 0; right: 0; top: 0; bottom: 84px; overflow-y: auto; box-sizing: border-box; padding-top: 50px">

<header style="display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 20px">
<a href="Mobile-Home.dc.html" aria-label="Mint, home" style="display: flex; align-items: center; gap: 10px; height: 44px; text-decoration: none; color: #ECEDEF">
<span aria-hidden="true" style="width: 14px; height: 14px; background: #ECEDEF; clip-path: polygon(0 0, 100% 0, 100% 62%, 62% 100%, 0 100%)"></span>
<span class="mono" style="font-size: 14px; font-weight: 600; letter-spacing: 0.34em">MINT</span>
</a>
<span class="mono" style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid #2C3138; border-radius: 2px; font-size: 13px">4,870 <span style="color: #A1A7AF">CR</span></span>
</header>

<div style="display: flex; flex-direction: column; gap: 20px; padding: 16px 20px 32px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span class="lbl">// Cases</span>
<h1 style="margin: 0; font-size: 32px; line-height: 1.05; font-weight: 600; letter-spacing: -0.02em">Cases</h1>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #A1A7AF">250 CR each, same odds everywhere.</p>
</div>

<div class="hscroll" role="list" aria-label="Odds, shared by every case" style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px; padding: 0 20px">
<sc-for list="{{odds}}" as="o" hint-placeholder-count="5">
<div role="listitem" style="flex: none; min-width: 108px; display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border: 1px solid #1C1F24; border-radius: 4px; background: #0E1013">
<span aria-hidden="true" style="width: 22px; height: 3px; background: {{o.color}}"></span>
<span style="font-size: 12px; color: #A1A7AF; white-space: nowrap">{{o.name}}</span>
<span class="mono" style="font-size: 17px; font-weight: 500">{{o.pct}}</span>
</div>
</sc-for>
</div>

<div class="hscroll" role="group" aria-label="Filter cases" style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px; padding: 0 20px">
<button type="button" aria-pressed="true" style="flex: none; height: 36px; padding: 0 14px; border: 1px solid #ECEDEF; border-radius: 2px; background: #ECEDEF; color: #0A0B0D; font: inherit; font-size: 13px; font-weight: 500">All</button>
<button type="button" aria-pressed="false" style="flex: none; height: 36px; padding: 0 14px; border: 1px solid #2C3138; border-radius: 2px; background: transparent; color: #ECEDEF; font: inherit; font-size: 13px; font-weight: 500">New</button>
<button type="button" aria-pressed="false" style="flex: none; height: 36px; padding: 0 14px; border: 1px solid #2C3138; border-radius: 2px; background: transparent; color: #ECEDEF; font: inherit; font-size: 13px; font-weight: 500">Album in progress</button>
<button type="button" aria-pressed="false" style="flex: none; height: 36px; padding: 0 14px; border: 1px solid #2C3138; border-radius: 2px; background: transparent; color: #ECEDEF; font: inherit; font-size: 13px; font-weight: 500">Not started</button>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{cases}}" as="c" hint-placeholder-count="6">
<a href="Mobile-Opening.dc.html" style="display: flex; flex-direction: column; border: 1px solid #1C1F24; border-radius: 4px; background: #0E1013; color: #ECEDEF; text-decoration: none; overflow: hidden">
<span style="position: relative; height: 104px; display: grid; place-items: center; background: radial-gradient(closest-side, rgba(236,237,239,0.08), rgba(236,237,239,0))">
<svg role="img" aria-label="{{c.name}} (placeholder art)" viewBox="0 0 240 120" style="width: 68%; fill: #C3C7CD; fill-rule: evenodd"><path d="{{caseArt}}"></path></svg>
<sc-if value="{{c.free}}" hint-placeholder-val="{{ false }}"><span class="lbl" style="position: absolute; left: 8px; top: 8px; padding: 3px 6px; font-size: 9px; background: #ECEDEF; color: #0A0B0D">Free today</span></sc-if>
<sc-if value="{{c.isNew}}" hint-placeholder-val="{{ false }}"><span class="lbl" style="position: absolute; left: 8px; top: 8px; padding: 2px 5px; font-size: 9px; border: 1px solid #2C3138; color: #ECEDEF">New</span></sc-if>
</span>
<span style="display: flex; flex-direction: column; gap: 8px; padding: 10px 12px 12px; border-top: 1px solid #1A1D22">
<span style="font-size: 13px; font-weight: 600; line-height: 1.25; min-height: 32px">{{c.name}}</span>
<span style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<span class="mono" style="font-size: 12px; color: #A1A7AF">{{c.price}}</span>
<span class="mono" style="font-size: 11px; color: #858B94">Album {{c.pct}}%</span>
</span>
<span aria-hidden="true" style="position: relative; height: 2px; background: #1E2227"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: {{c.pct}}%; background: #ECEDEF"></span></span>
</span>
</a>
</sc-for>
</div>
</div>
</div>

<nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 6px 6px 24px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #0D0E11; border-top: 1px solid #1C1F24">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<a href="{{t.href}}" aria-current="{{t.current}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 50px; text-decoration: none; font-size: 11px; font-weight: 500; color: {{t.color}}">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round"><path d="{{t.icon}}"></path></svg>
<span>{{t.label}}</span>
</a>
</sc-for>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const CASE_ART = 'M38 34H202A8 8 0 0 1 210 42V96A8 8 0 0 1 202 104H38A8 8 0 0 1 30 96V42A8 8 0 0 1 38 34Z M98 18H142V34H134V25H106V34H98Z M30 58H210V61H30Z M120 66L132 78L120 90L108 78Z M52 44H68V50H52Z M172 44H188V50H172Z';
const TABS = [
  ['home', 'Home', 'Mobile-Home.dc.html', 'M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z'],
  ['cases', 'Cases', 'Mobile-Cases.dc.html', 'M3 8h18v12H3zM3 12h18M10 12v3h4v-3M8 8V5h8v3'],
  ['inventory', 'Inventory', 'Mobile-Inventory.dc.html', 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z'],
  ['albums', 'Albums', 'Mobile-Album.dc.html', 'M8 3h12v14H8zM4 7v14h12'],
  ['more', 'More', 'Mobile-More.dc.html', 'M4 6h16M4 12h16M4 18h16']
];
class Component extends DCLogic {
  renderVals() {
    const cases = [
      ['Kilowatt Case', 65, true, false], ['Fever Case', 0, false, true], ['Gallery Case', 12, false, false], ['Revolution Case', 24, false, false],
      ['Recoil Case', 6, false, false], ['Dreams & Nightmares Case', 0, false, false], ['Snakebite Case', 0, false, false], ['Fracture Case', 18, false, false]
    ].map((c) => ({ name: c[0], pct: c[1], free: c[2], isNew: c[3], price: c[2] ? 'Free' : '250 CR' }));
    return {
      caseArt: CASE_ART,
      cases,
      odds: [
        { name: 'Mil-Spec', pct: '79.92%', color: '#4B69FF' },
        { name: 'Restricted', pct: '15.98%', color: '#8847FF' },
        { name: 'Classified', pct: '3.20%', color: '#D32CE6' },
        { name: 'Covert', pct: '0.64%', color: '#EB4B4B' },
        { name: '★ Knife or gloves', pct: '0.26%', color: '#E4AE39' }
      ],
      tabs: TABS.map((t) => ({ label: t[1], href: t[2], icon: t[3], current: t[0] === 'cases' ? 'page' : undefined, color: t[0] === 'cases' ? '#ECEDEF' : '#858B94' }))
    };
  }
}
</script>
</body>
</html>
