<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mint — Friends (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0B0D}
a{color:#ECEDEF}a:hover{color:#FFFFFF}
.mono{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-variant-numeric:tabular-nums}
.lbl{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#858B94}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0A0B0D; color: #ECEDEF; font-family: 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif">

<div style="position: absolute; left: 0; right: 0; top: 0; bottom: 84px; overflow-y: auto; box-sizing: border-box; padding-top: 50px">
<header style="display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 8px">
<a href="Mobile-More.dc.html" style="display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 12px; color: #A1A7AF; text-decoration: none; font-size: 14px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round"><path d="M15 6l-6 6 6 6"></path></svg>More</a>
</header>

<div style="display: flex; flex-direction: column; gap: 22px; padding: 8px 20px 32px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 32px; line-height: 1.05; font-weight: 600; letter-spacing: -0.02em">Friends</h1>
<p class="mono" style="margin: 0; font-size: 12px; color: #A1A7AF">6 friends · 2 requests</p>
</div>

<label style="display: flex; flex-direction: column; gap: 6px">
<span class="lbl">Add a friend</span>
<input type="search" placeholder="Search by name" style="box-sizing: border-box; width: 100%; height: 44px; padding: 0 14px; border: 1px solid #2C3138; border-radius: 2px; background: #0E1013; color: #ECEDEF; font: inherit; font-size: 15px">
</label>

<section aria-labelledby="mf-req" style="display: flex; flex-direction: column">
<h2 id="mf-req" class="lbl" style="margin: 0 0 8px">Requests · 2</h2>
<sc-for list="{{requests}}" as="r" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid #1A1D22">
<span aria-hidden="true" style="flex: none; width: 36px; height: 36px; border-radius: 50%; background: #1A1D22; display: grid; place-items: center; font-size: 14px; font-weight: 600; color: #A1A7AF">{{r.initial}}</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">{{r.name}}</span><span class="mono" style="font-size: 11px; color: #858B94">{{r.stats}}</span></span>
<button type="button" aria-label="Decline {{r.name}}" style="width: 44px; height: 44px; border: 1px solid #2C3138; border-radius: 2px; background: transparent; color: #A1A7AF; display: grid; place-items: center"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
<button type="button" style="height: 44px; padding: 0 14px; border: 0; border-radius: 2px; background: #ECEDEF; color: #0A0B0D; font: inherit; font-size: 14px; font-weight: 600">Accept</button>
</div>
</sc-for>
</section>

<section aria-labelledby="mf-list" style="display: flex; flex-direction: column; gap: 8px">
<h2 id="mf-list" class="lbl" style="margin: 0 0 2px">Your friends</h2>
<sc-for list="{{friends}}" as="f" hint-placeholder-count="6">
<a href="Mobile-Profile.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px solid #1C1F24; border-radius: 6px; background: #0E1013; color: #ECEDEF; text-decoration: none">
<span aria-hidden="true" style="flex: none; width: 40px; height: 40px; border-radius: 50%; background: #1A1D22; display: grid; place-items: center; font-size: 15px; font-weight: 600">{{f.initial}}</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px"><span style="font-size: 15px; font-weight: 600">{{f.name}}</span><span class="mono" style="font-size: 11px; color: #A1A7AF">{{f.stats}}</span></span>
<span role="img" aria-label="{{f.showcaseLabel}}" style="display: flex; gap: 3px">
<sc-for list="{{f.showcase}}" as="s" hint-placeholder-count="5"><span style="flex: 1; height: 18px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; background: #121417; border: 1px solid #1C1F24; border-radius: 2px; overflow: hidden"><span style="height: 2px; background: {{s.color}}"></span></span></sc-for>
</span>
</span>
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" style="flex: none; fill: none; stroke: #858B94; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round"><path d="M9 6l6 6-6 6"></path></svg>
</a>
</sc-for>
</section>
</div>
</div>

<nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 6px 6px 24px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #0D0E11; border-top: 1px solid #1C1F24">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<a href="{{t.href}}" aria-current="{{t.current}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 50px; text-decoration: none; font-size: 11px; font-weight: 500; color: {{t.color}}">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round"><path d="{{t.icon}}"></path></svg>
<span>{{t.label}}</span>
</a>
</sc-for>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const TABS = [
  ['home', 'Home', 'Mobile-Home.dc.html', 'M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z'],
  ['cases', 'Cases', 'Mobile-Cases.dc.html', 'M3 8h18v12H3zM3 12h18M10 12v3h4v-3M8 8V5h8v3'],
  ['inventory', 'Inventory', 'Mobile-Inventory.dc.html', 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z'],
  ['albums', 'Albums', 'Mobile-Album.dc.html', 'M8 3h12v14H8zM4 7v14h12'],
  ['more', 'More', 'Mobile-More.dc.html', 'M4 6h16M4 12h16M4 18h16']
];
const RC = { milspec: '#4B69FF', restricted: '#8847FF', classified: '#D32CE6', covert: '#EB4B4B', gold: '#E4AE39' };
const RN = { milspec: 'Mil-Spec', restricted: 'Restricted', classified: 'Classified', covert: 'Covert', gold: '★' };
const P = [
  ['nyx', '64,800 CR · 29%', ['gold', 'gold', 'covert', 'covert', 'classified']],
  ['kenji', '41,200 CR · 38%', ['gold', 'covert', 'covert', 'classified', 'classified']],
  ['lou', '18,950 CR · 52%', ['covert', 'classified', 'classified', 'restricted', 'restricted']],
  ['ash', '12,600 CR · 33%', ['covert', 'classified', 'restricted', 'restricted', 'milspec']],
  ['rhea', '9,400 CR · 61%', ['classified', 'classified', 'restricted', 'restricted', 'milspec']],
  ['tomb', '3,120 CR · 14%', ['restricted', 'restricted', 'milspec', 'milspec', 'milspec']]
];
class Component extends DCLogic {
  renderVals() {
    return {
      tabs: TABS.map((t) => ({ label: t[1], href: t[2], icon: t[3], current: t[0] === 'more' ? 'page' : undefined, color: t[0] === 'more' ? '#ECEDEF' : '#858B94' })),
      requests: [['dune', '≈ 22,100 CR · albums 58%'], ['milo', '≈ 33,450 CR · albums 21%']].map((r) => ({ name: r[0], initial: r[0][0].toUpperCase(), stats: r[1] })),
      friends: P.map((f) => ({ name: f[0], initial: f[0][0].toUpperCase(), stats: f[1], showcase: f[2].map((r) => ({ color: RC[r] })), showcaseLabel: 'Showcase: ' + f[2].map((r) => RN[r]).join(', ') }))
    };
  }
}
</script>
</body>
</html>
