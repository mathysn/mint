<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mint — Inventory (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0B0D}
a{color:#ECEDEF}a:hover{color:#FFFFFF}
.mono{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-variant-numeric:tabular-nums}
.lbl{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#858B94}
.hscroll{scrollbar-width:none}.hscroll::-webkit-scrollbar{display:none}
.stretch::after{content:"";position:absolute;inset:0;z-index:1}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0A0B0D; color: #ECEDEF; font-family: 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif">

<div style="position: absolute; left: 0; right: 0; top: 0; bottom: 84px; overflow-y: auto; box-sizing: border-box; padding-top: 50px">

<header style="display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 20px">
<a href="Mobile-Home.dc.html" aria-label="Mint, home" style="display: flex; align-items: center; gap: 10px; height: 44px; text-decoration: none; color: #ECEDEF">
<span aria-hidden="true" style="width: 14px; height: 14px; background: #ECEDEF; clip-path: polygon(0 0, 100% 0, 100% 62%, 62% 100%, 0 100%)"></span>
<span class="mono" style="font-size: 14px; font-weight: 600; letter-spacing: 0.34em">MINT</span>
</a>
<span class="mono" style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid #2C3138; border-radius: 2px; font-size: 13px">4,870 <span style="color: #A1A7AF">CR</span></span>
</header>

<div style="display: flex; flex-direction: column; gap: 16px; padding: 16px 20px 120px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 32px; line-height: 1.05; font-weight: 600; letter-spacing: -0.02em">Inventory</h1>
<p class="mono" style="margin: 0; font-size: 12px; color: #A1A7AF">18 items · ≈ 28,790 CR</p>
</div>

<label style="display: flex; flex-direction: column; gap: 6px">
<span class="lbl">Search</span>
<input type="search" placeholder="Weapon or skin" style="box-sizing: border-box; width: 100%; height: 44px; padding: 0 14px; border: 1px solid #2C3138; border-radius: 2px; background: #0E1013; color: #ECEDEF; font: inherit; font-size: 15px">
</label>

<div class="hscroll" role="group" aria-label="Rarity" style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px; padding: 0 20px">
<sc-for list="{{chips}}" as="r" hint-placeholder-count="6">
<button type="button" aria-pressed="{{r.on}}" style="flex: none; display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 12px; border-radius: 2px; font: inherit; font-size: 13px; font-weight: 500; {{r.style}}"><span aria-hidden="true" style="width: 7px; height: 7px; background: {{r.color}}"></span>{{r.label}}</button>
</sc-for>
</div>

<div style="display: flex; justify-content: space-between; align-items: center">
<button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0; border: 0; background: none; color: #ECEDEF; font: inherit; font-size: 14px">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 5v4M6 15v4"></path></svg>
Filters · Value ↓</button>
<button type="button" aria-pressed="true" style="height: 36px; padding: 0 12px; border: 1px solid #ECEDEF; border-radius: 2px; background: transparent; color: #ECEDEF; font: inherit; font-size: 13px; font-weight: 500">Selecting</button>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{items}}" as="c" hint-placeholder-count="8">
<div style="position: relative; display: flex; flex-direction: column; background: #0E1013; border: 1px solid {{c.border}}; border-radius: 4px; overflow: hidden">
<div style="position: relative; height: 104px; display: grid; place-items: center">
<span aria-hidden="true" style="position: absolute; inset: 10% 10%; background: radial-gradient(closest-side, {{c.glow}}, rgba(0,0,0,0)); opacity: {{c.artOpacity}}"></span>
<svg role="img" aria-label="{{c.full}} (placeholder art)" viewBox="0 0 240 100" style="position: relative; width: 80%; fill: #D3D6DB; opacity: {{c.artOpacity}}"><path d="{{c.art}}"></path></svg>
<sc-if value="{{c.st}}" hint-placeholder-val="{{ false }}"><span class="mono" style="position: absolute; right: 8px; top: 10px; padding: 1px 5px; background: #ECEDEF; color: #0A0B0D; font-size: 9px; font-weight: 600">ST™</span></sc-if>
<sc-if value="{{c.locked}}" hint-placeholder-val="{{ false }}"><span class="lbl" style="position: absolute; left: 10px; top: 12px; display: flex; align-items: center; gap: 5px; font-size: 9px; color: #ECEDEF"><svg aria-hidden="true" width="10" height="10" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 2"><path d="M6 11h12v9H6zM8.5 11V8a3.5 3.5 0 0 1 7 0v3"></path></svg>{{c.lockLabel}}</span></sc-if>
</div>
<div style="padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 11px; color: #A1A7AF">{{c.weapon}}</span>
<a href="Mobile-Item.dc.html" class="stretch" style="font-size: 14px; font-weight: 600; color: #ECEDEF; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.skin}}</a>
<span style="display: flex; justify-content: space-between; gap: 6px; margin-top: 6px">
<span class="mono" style="display: flex; align-items: center; gap: 5px; font-size: 11px; color: #A1A7AF"><span aria-hidden="true" style="width: 5px; height: 5px; background: {{c.wearColor}}"></span>{{c.wear}} {{c.floatShort}}</span>
<span class="mono" style="font-size: 11px">{{c.valueFmt}}</span>
</span>
</div>
<span aria-hidden="true" style="height: 3px; background: {{c.color}}"></span>
<sc-if value="{{c.selectable}}" hint-placeholder-val="{{ true }}">
<button type="button" aria-pressed="{{c.selected}}" aria-label="Select {{c.full}}" style="position: absolute; left: 0; top: 0; z-index: 2; width: 44px; height: 44px; padding: 0; border: 0; background: transparent; display: grid; place-items: center">
<span aria-hidden="true" style="width: 20px; height: 20px; box-sizing: border-box; border-radius: 2px; display: grid; place-items: center; {{c.checkStyle}}">
<sc-if value="{{c.selected}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" style="fill: none; stroke: #0A0B0D; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
</span>
</button>
</sc-if>
</div>
</sc-for>
</div>
</div>
</div>

<div role="region" aria-label="Selection" style="position: absolute; left: 12px; right: 12px; bottom: 96px; z-index: 5; display: flex; flex-direction: column; gap: 10px; padding: 14px; border: 1px solid #ECEDEF; border-radius: 6px; background: #111316; box-shadow: 0 12px 32px rgba(0,0,0,0.6)">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 15px; font-weight: 600">2 selected</span><span class="mono" style="font-size: 12px; color: #A1A7AF">≈ 3,250 CR</span></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<a href="Mobile-Sell.dc.html" style="display: flex; align-items: center; justify-content: center; height: 44px; border: 1px solid #2C3138; border-radius: 2px; color: #ECEDEF; text-decoration: none; font-size: 14px; font-weight: 500">List on market</a>
<button type="button" style="height: 44px; border: 0; background: #ECEDEF; color: #0A0B0D; font: inherit; font-size: 14px; font-weight: 600; clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%)">Recycle +3,250</button>
</div>
</div>

<nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 6px 6px 24px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #0D0E11; border-top: 1px solid #1C1F24">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<a href="{{t.href}}" aria-current="{{t.current}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 50px; text-decoration: none; font-size: 11px; font-weight: 500; color: {{t.color}}">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round"><path d="{{t.icon}}"></path></svg>
<span>{{t.label}}</span>
</a>
</sc-for>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const ART = {
  rifle: 'M10 46L58 38L60 52L18 66Q10 67 10 60Z M56 35H150V52H56Z M70 30H140V35H70Z M150 38H196V50H150Z M196 42H232V46H196Z M186 32H191V38H186Z M112 52H128Q131 68 140 82L124 86Q116 70 112 52Z M80 52H94L88 76H76Z',
  sniper: 'M8 50L60 44L62 58L32 60L16 72Q8 73 8 66Z M58 44H150V56H58Z M150 47H234V51H150Z M80 30H132V40H80Z M70 27H82V43H70Z M130 28H142V42H130Z M96 40H102V44H96Z M112 40H118V44H112Z M76 56H90L84 78H72Z M110 56H124V70H110Z',
  pistol: 'M70 30H182V46H70Z M74 46H176V54H120V58H74Z M76 54H108L100 88Q99 92 94 92H70Q64 92 66 86Z M108 56Q110 68 122 68V64Q114 64 112 56Z M182 34H188V42H182Z',
  smg: 'M60 36H160V54H60Z M160 42H200V47H160Z M20 40H60V44H28V56H60V60H20Z M118 54H132L134 90H120Z M76 54H90L84 78H72Z M70 31H80V36H70Z',
  knife: 'M22 58L84 50Q90 50 90 56V62Q90 66 84 66L26 70Q18 70 18 64Q18 58 22 58Z M88 44H96V72H88Z M96 50Q150 40 200 52Q222 58 226 64Q200 76 150 70Q120 66 96 66Z'
};
const RAR = {
  milspec: ['#4B69FF', 'rgba(75,105,255,0.30)'], restricted: ['#8847FF', 'rgba(136,71,255,0.32)'],
  classified: ['#D32CE6', 'rgba(211,44,230,0.30)'], covert: ['#EB4B4B', 'rgba(235,75,75,0.32)'], gold: ['#E4AE39', 'rgba(228,174,57,0.36)']
};
const WEARC = { FN: '#3FB950', MW: '#9BC53D', FT: '#E3B341', WW: '#F0883E', BS: '#F05D52' };
// weapon, skin, rarity, art, wear, float, value, st, status, selected
const DATA = [
  ['★ Kukri Knife', 'Fade', 'gold', 'knife', 'FN', '0.0213', '15,000', false, 'ok', false],
  ['AWP', 'Chrome Cannon', 'covert', 'sniper', 'MW', '0.0934', '6,000', true, 'ok', false],
  ['AK-47', 'Inheritance', 'covert', 'rifle', 'FT', '0.2381', '2,500', false, 'ok', true],
  ['AK-47', 'Head Shot', 'covert', 'rifle', 'FT', '0.2710', '2,500', false, 'listed', false],
  ['M4A1-S', 'Black Lotus', 'classified', 'rifle', 'FN', '0.0512', '750', false, 'ok', true],
  ['AWP', 'Duality', 'classified', 'sniper', 'MW', '0.1130', '600', false, 'trade', false],
  ['USP-S', 'Jawbreaker', 'classified', 'pistol', 'WW', '0.4012', '450', false, 'ok', false],
  ['Glock-18', 'Block-18', 'restricted', 'pistol', 'FT', '0.1876', '240', true, 'ok', false]
];
class Component extends DCLogic {
  renderVals() {
    const items = DATA.map((d) => {
      const locked = d[8] !== 'ok';
      const selected = d[9];
      return {
        weapon: d[0], skin: d[1], full: d[0] + ' | ' + d[1], color: RAR[d[2]][0], glow: RAR[d[2]][1], art: ART[d[3]],
        wear: d[4], wearColor: WEARC[d[4]], floatShort: d[5], valueFmt: d[6], st: d[7],
        locked, selectable: !locked, selected, lockLabel: d[8] === 'listed' ? 'Listed' : 'In trade',
        artOpacity: locked ? '0.4' : '1',
        border: selected ? '#ECEDEF' : '#1C1F24',
        checkStyle: selected ? 'background: #ECEDEF; border: 1px solid #ECEDEF' : 'background: rgba(10,11,13,0.7); border: 1px solid #4A5059'
      };
    });
    const chips = [['All', '#ECEDEF', true], ['Mil-Spec', '#4B69FF'], ['Restricted', '#8847FF'], ['Classified', '#D32CE6'], ['Covert', '#EB4B4B'], ['★ Rare special', '#E4AE39']].map((c) => ({
      label: c[0], color: c[1], on: !!c[2],
      style: c[2] ? 'background: #1E2227; color: #ECEDEF; border: 1px solid #ECEDEF' : 'background: transparent; color: #A1A7AF; border: 1px solid #2C3138'
    }));
    const tabs = [
      ['home', 'Home', 'Mobile-Home.dc.html', 'M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z'],
      ['cases', 'Cases', 'Mobile-Cases.dc.html', 'M3 8h18v12H3zM3 12h18M10 12v3h4v-3M8 8V5h8v3'],
      ['inventory', 'Inventory', 'Mobile-Inventory.dc.html', 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z'],
      ['albums', 'Albums', 'Mobile-Album.dc.html', 'M8 3h12v14H8zM4 7v14h12'],
      ['more', 'More', 'Mobile-More.dc.html', 'M4 6h16M4 12h16M4 18h16']
    ].map((t) => ({ label: t[1], href: t[2], icon: t[3], current: t[0] === 'inventory' ? 'page' : undefined, color: t[0] === 'inventory' ? '#ECEDEF' : '#858B94' }));
    return { items, chips, tabs };
  }
}
</script>
</body>
</html>
