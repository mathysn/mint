<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mint — AWP | Chrome Cannon (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0B0D}
a{color:#ECEDEF}a:hover{color:#FFFFFF}
.mono{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-variant-numeric:tabular-nums}
.lbl{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#858B94}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0A0B0D; color: #ECEDEF; font-family: 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif">

<div style="position: absolute; left: 0; right: 0; top: 0; bottom: 84px; overflow-y: auto; box-sizing: border-box; padding-top: 50px">

<header style="display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 8px">
<a href="Mobile-Inventory.dc.html" style="display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 12px; color: #A1A7AF; text-decoration: none; font-size: 14px">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round"><path d="M15 6l-6 6 6 6"></path></svg>Inventory</a>
<button type="button" aria-label="More actions" style="width: 44px; height: 44px; border: 0; background: none; color: #A1A7AF; display: grid; place-items: center">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" style="fill: currentColor"><path d="M5 10.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zM12 10.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zM19 10.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"></path></svg>
</button>
</header>

<div style="position: relative; height: 250px; display: grid; place-items: center; border-top: 1px solid #1C1F24; border-bottom: 1px solid #1C1F24; background: radial-gradient(ellipse at 50% 50%, rgba(235,75,75,0.12), rgba(14,16,19,0) 70%), #0E1013">
<span aria-hidden="true" style="position: absolute; inset: 6% 4%; background: radial-gradient(closest-side, rgba(235,75,75,0.30), rgba(235,75,75,0))"></span>
<span aria-hidden="true" style="position: absolute; left: 16px; top: 16px; width: 16px; height: 16px; border-left: 1px solid #5A616B; border-top: 1px solid #5A616B"></span>
<span aria-hidden="true" style="position: absolute; right: 16px; top: 16px; width: 16px; height: 16px; border-right: 1px solid #5A616B; border-top: 1px solid #5A616B"></span>
<span aria-hidden="true" style="position: absolute; left: 16px; bottom: 16px; width: 16px; height: 16px; border-left: 1px solid #5A616B; border-bottom: 1px solid #5A616B"></span>
<span aria-hidden="true" style="position: absolute; right: 16px; bottom: 16px; width: 16px; height: 16px; border-right: 1px solid #5A616B; border-bottom: 1px solid #5A616B"></span>
<span class="lbl" style="position: absolute; left: 28px; top: 28px; font-size: 10px; color: #F27D7D">Covert</span>
<span class="lbl" style="position: absolute; right: 28px; top: 28px; font-size: 10px">#712</span>
<svg role="img" aria-label="AWP | Chrome Cannon (placeholder art)" viewBox="0 0 240 100" style="position: relative; width: 90%; fill: #DADDE2"><path d="{{art}}"></path></svg>
</div>

<div style="display: flex; flex-direction: column; gap: 20px; padding: 20px 20px 104px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; color: #A1A7AF">AWP</span>
<h1 style="margin: 0; font-size: 34px; line-height: 1.02; font-weight: 600; letter-spacing: -0.02em">Chrome Cannon</h1>
<div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px">
<span class="mono" style="display: inline-flex; align-items: center; height: 28px; padding: 0 8px; border-radius: 2px; background: #ECEDEF; color: #0A0B0D; font-size: 11px; font-weight: 600">STATTRAK™</span>
<span style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border: 1px solid #2C3138; border-radius: 2px; font-size: 12px"><span aria-hidden="true" style="width: 7px; height: 7px; background: #9BC53D"></span>Minimal Wear</span>
</div>
</div>

<section aria-labelledby="mi-float" style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border: 1px solid #1C1F24; border-radius: 6px; background: #0E1013">
<div style="display: flex; justify-content: space-between; align-items: baseline"><h2 id="mi-float" class="lbl" style="margin: 0">Float</h2><span class="mono" style="font-size: 20px; font-weight: 500">0.093412887</span></div>
<div style="position: relative; padding-top: 8px">
<div aria-hidden="true" style="position: relative; display: flex; gap: 2px; height: 7px">
<span style="flex: 7 1 0; background: #3FB950"></span><span style="flex: 8 1 0; background: #9BC53D"></span><span style="flex: 23 1 0; background: #E3B341"></span><span style="flex: 7 1 0; background: #F0883E"></span><span style="flex: 55 1 0; background: #F05D52"></span>
<span style="position: absolute; left: 70%; right: 0; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, rgba(10,11,13,0.82) 0 4px, rgba(10,11,13,0.6) 4px 8px)"></span>
</div>
<span aria-hidden="true" style="position: absolute; top: 0; left: 9.34%; width: 2px; height: 23px; margin-left: -1px; background: #ECEDEF"></span>
<div class="mono" aria-hidden="true" style="display: flex; gap: 2px; margin-top: 10px; font-size: 9px; color: #858B94"><span style="flex: 7 1 0">FN</span><span style="flex: 8 1 0">MW</span><span style="flex: 23 1 0">FT</span><span style="flex: 7 1 0">WW</span><span style="flex: 55 1 0">BS</span></div>
</div>
<p style="margin: 0; font-size: 12px; color: #A1A7AF">Drops between <span class="mono">0.00</span> and <span class="mono">0.70</span>.</p>
</section>

<section aria-labelledby="mi-sales" style="display: flex; flex-direction: column; gap: 14px; padding: 16px; border: 1px solid #1C1F24; border-radius: 6px; background: #0E1013">
<div style="display: flex; justify-content: space-between; align-items: baseline"><h2 id="mi-sales" class="lbl" style="margin: 0">Recent sales · 30 d</h2><span class="mono" style="font-size: 11px; color: #858B94">12 sales</span></div>
<div style="display: flex; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #A1A7AF">Average</span><span class="mono" style="font-size: 18px">{{avg}} CR</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #A1A7AF">Last sale</span><span class="mono" style="font-size: 18px">7,100 CR</span></div>
</div>
<svg role="img" aria-label="Sale prices over the last 30 days, between 6,800 and 7,600 CR" viewBox="0 0 400 120" preserveAspectRatio="none" style="width: 100%; height: 80px">
<line x1="0" y1="{{avgY}}" x2="400" y2="{{avgY}}" style="stroke: #5A616B; stroke-width: 1; stroke-dasharray: 3 4; vector-effect: non-scaling-stroke"></line>
<polyline points="{{points}}" style="fill: none; stroke: #ECEDEF; stroke-width: 1.5; vector-effect: non-scaling-stroke"></polyline>
</svg>
<div style="display: flex; justify-content: space-between; align-items: baseline; padding-top: 12px; border-top: 1px solid #1A1D22"><span style="font-size: 13px; color: #A1A7AF">Recycle value</span><span class="mono" style="font-size: 15px">6,000 CR</span></div>
</section>

<dl style="margin: 0; display: flex; flex-direction: column">
<sc-for list="{{facts}}" as="f" hint-placeholder-count="4">
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid #1A1D22; font-size: 14px"><dt style="color: #A1A7AF">{{f.k}}</dt><dd style="margin: 0; text-align: right">{{f.v}}</dd></div>
</sc-for>
</dl>
</div>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 84px; z-index: 5; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; padding: 12px 16px; background: #0A0B0D; border-top: 1px solid #1C1F24">
<button type="button" style="height: 48px; border: 1px solid #2C3138; border-radius: 2px; background: transparent; color: #ECEDEF; font: inherit; font-size: 14px; font-weight: 500">Recycle +6,000</button>
<a href="Mobile-Sell.dc.html" style="display: flex; align-items: center; justify-content: center; height: 48px; background: #ECEDEF; color: #0A0B0D; text-decoration: none; font-size: 15px; font-weight: 600; clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%)">List on market</a>
</div>

<nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 6px 6px 24px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #0D0E11; border-top: 1px solid #1C1F24">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<a href="{{t.href}}" aria-current="{{t.current}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 50px; text-decoration: none; font-size: 11px; font-weight: 500; color: {{t.color}}">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round"><path d="{{t.icon}}"></path></svg>
<span>{{t.label}}</span>
</a>
</sc-for>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const SNIPER = 'M8 50L60 44L62 58L32 60L16 72Q8 73 8 66Z M58 44H150V56H58Z M150 47H234V51H150Z M80 30H132V40H80Z M70 27H82V43H70Z M130 28H142V42H130Z M96 40H102V44H96Z M112 40H118V44H112Z M76 56H90L84 78H72Z M110 56H124V70H110Z';
const SALES = [6900, 7350, 7050, 7600, 7200, 6800, 7400, 7300, 7150, 7500, 7250, 7100];
class Component extends DCLogic {
  renderVals() {
    const lo = 6700, hi = 7700;
    const y = (p) => (110 - ((p - lo) / (hi - lo)) * 100).toFixed(1);
    const avg = SALES.reduce((a, b) => a + b, 0) / SALES.length;
    const tabs = [
      ['home', 'Home', 'Mobile-Home.dc.html', 'M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z'],
      ['cases', 'Cases', 'Mobile-Cases.dc.html', 'M3 8h18v12H3zM3 12h18M10 12v3h4v-3M8 8V5h8v3'],
      ['inventory', 'Inventory', 'Mobile-Inventory.dc.html', 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z'],
      ['albums', 'Albums', 'Mobile-Album.dc.html', 'M8 3h12v14H8zM4 7v14h12'],
      ['more', 'More', 'Mobile-More.dc.html', 'M4 6h16M4 12h16M4 18h16']
    ].map((t) => ({ label: t[1], href: t[2], icon: t[3], current: t[0] === 'inventory' ? 'page' : undefined, color: t[0] === 'inventory' ? '#ECEDEF' : '#858B94' }));
    return {
      tabs,
      art: SNIPER,
      points: SALES.map((p, i) => (i * (400 / (SALES.length - 1))).toFixed(1) + ',' + y(p)).join(' '),
      avg: Math.round(avg).toLocaleString('en-US'),
      avgY: y(avg),
      facts: [
        { k: 'Collection', v: 'The Kilowatt Collection' },
        { k: 'Obtained', v: 'Oct 18, 2026' },
        { k: 'Original owner', v: 'vex (you)' },
        { k: 'Status', v: 'Available' }
      ]
    };
  }
}
</script>
</body>
</html>
