<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mint — Market (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0B0D}
a{color:#ECEDEF}a:hover{color:#FFFFFF}
.mono{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-variant-numeric:tabular-nums}
.lbl{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#858B94}
.hscroll{scrollbar-width:none}.hscroll::-webkit-scrollbar{display:none}
@keyframes mint-blink{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.anim{animation:none !important}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0A0B0D; color: #ECEDEF; font-family: 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif">

<div style="position: absolute; left: 0; right: 0; top: 0; bottom: 84px; overflow-y: auto; box-sizing: border-box; padding-top: 50px">
<header style="display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 8px">
<a href="Mobile-More.dc.html" style="display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 12px; color: #A1A7AF; text-decoration: none; font-size: 14px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round"><path d="M15 6l-6 6 6 6"></path></svg>More</a>
<a href="Mobile-Sell.dc.html" style="display: inline-flex; align-items: center; height: 36px; padding: 0 14px; margin-right: 12px; background: #ECEDEF; color: #0A0B0D; text-decoration: none; font-size: 14px; font-weight: 600; border-radius: 2px">List an item</a>
</header>

<div style="display: flex; flex-direction: column; gap: 16px; padding: 8px 20px 32px">
<div style="display: flex; flex-direction: column; gap: 4px">
<span class="lbl">// Auction house</span>
<h1 style="margin: 0; font-size: 32px; line-height: 1.05; font-weight: 600; letter-spacing: -0.02em">Market</h1>
</div>

<div role="tablist" aria-label="Market views" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border: 1px solid #1C1F24; border-radius: 4px; background: #0E1013">
<button type="button" role="tab" aria-selected="true" style="height: 40px; border: 0; border-radius: 2px; background: #ECEDEF; color: #0A0B0D; font: inherit; font-size: 14px; font-weight: 600">Browse</button>
<button type="button" role="tab" aria-selected="false" style="height: 40px; border: 0; border-radius: 2px; background: transparent; color: #A1A7AF; font: inherit; font-size: 14px; font-weight: 500">Mine · 1</button>
<button type="button" role="tab" aria-selected="false" style="height: 40px; border: 0; border-radius: 2px; background: transparent; color: #A1A7AF; font: inherit; font-size: 14px; font-weight: 500">Bids · 2</button>
</div>

<label style="display: flex; flex-direction: column; gap: 6px">
<span class="lbl">Search</span>
<input type="search" placeholder="Weapon or skin" style="box-sizing: border-box; width: 100%; height: 44px; padding: 0 14px; border: 1px solid #2C3138; border-radius: 2px; background: #0E1013; color: #ECEDEF; font: inherit; font-size: 15px">
</label>

<div class="hscroll" role="group" aria-label="Rarity" style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px; padding: 0 20px">
<sc-for list="{{chips}}" as="r" hint-placeholder-count="6">
<button type="button" aria-pressed="{{r.on}}" style="flex: none; display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 12px; border-radius: 2px; font: inherit; font-size: 13px; font-weight: 500; {{r.style}}"><span aria-hidden="true" style="width: 7px; height: 7px; background: {{r.color}}"></span>{{r.label}}</button>
</sc-for>
</div>

<div style="display: flex; justify-content: space-between; align-items: center"><span class="mono" style="font-size: 12px; color: #A1A7AF">12 auctions</span><span style="font-size: 13px; color: #A1A7AF">Sort: Ending soon</span></div>

<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{rows}}" as="c" hint-placeholder-count="8">
<li>
<a href="Mobile-Auction.dc.html" style="position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 12px 12px 10px; border: 1px solid #1C1F24; border-radius: 4px; background: #0E1013; color: #ECEDEF; text-decoration: none; overflow: hidden">
<span style="position: relative; flex: none; width: 84px; height: 54px; display: grid; place-items: center"><span aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(closest-side, {{c.glow}}, rgba(0,0,0,0))"></span><svg role="img" aria-label="{{c.full}} (placeholder art)" viewBox="0 0 240 100" style="position: relative; width: 100%; fill: {{c.fill}}"><path d="{{c.art}}"></path></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 11px; color: #A1A7AF">{{c.weapon}}<sc-if value="{{c.st}}" hint-placeholder-val="{{ false }}"> · ST™</sc-if></span>
<span style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.skin}}</span>
<span class="mono" style="font-size: 11px; color: #A1A7AF">{{c.bid}} CR · {{c.bidsLabel}}</span>
</span>
<span class="mono" style="flex: none; display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 7px; border-radius: 2px; font-size: 11px; font-weight: 500; {{c.timerStyle}}"><sc-if value="{{c.urgent}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" class="anim" style="width: 5px; height: 5px; border-radius: 50%; background: #C8382F; animation: mint-blink 1s ease-in-out infinite"></span></sc-if>{{c.timer}}</span>
<span aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: {{c.color}}"></span>
</a>
</li>
</sc-for>
</ul>
</div>
</div>

<nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 6px 6px 24px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #0D0E11; border-top: 1px solid #1C1F24">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<a href="{{t.href}}" aria-current="{{t.current}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 50px; text-decoration: none; font-size: 11px; font-weight: 500; color: {{t.color}}">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round"><path d="{{t.icon}}"></path></svg>
<span>{{t.label}}</span>
</a>
</sc-for>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const TABS = [
  ['home', 'Home', 'Mobile-Home.dc.html', 'M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z'],
  ['cases', 'Cases', 'Mobile-Cases.dc.html', 'M3 8h18v12H3zM3 12h18M10 12v3h4v-3M8 8V5h8v3'],
  ['inventory', 'Inventory', 'Mobile-Inventory.dc.html', 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z'],
  ['albums', 'Albums', 'Mobile-Album.dc.html', 'M8 3h12v14H8zM4 7v14h12'],
  ['more', 'More', 'Mobile-More.dc.html', 'M4 6h16M4 12h16M4 18h16']
];
const ART = {
  rifle: 'M10 46L58 38L60 52L18 66Q10 67 10 60Z M56 35H150V52H56Z M70 30H140V35H70Z M150 38H196V50H150Z M196 42H232V46H196Z M186 32H191V38H186Z M112 52H128Q131 68 140 82L124 86Q116 70 112 52Z M80 52H94L88 76H76Z',
  sniper: 'M8 50L60 44L62 58L32 60L16 72Q8 73 8 66Z M58 44H150V56H58Z M150 47H234V51H150Z M80 30H132V40H80Z M70 27H82V43H70Z M130 28H142V42H130Z M96 40H102V44H96Z M112 40H118V44H112Z M76 56H90L84 78H72Z M110 56H124V70H110Z',
  pistol: 'M70 30H182V46H70Z M74 46H176V54H120V58H74Z M76 54H108L100 88Q99 92 94 92H70Q64 92 66 86Z M108 56Q110 68 122 68V64Q114 64 112 56Z M182 34H188V42H182Z',
  smg: 'M60 36H160V54H60Z M160 42H200V47H160Z M20 40H60V44H28V56H60V60H20Z M118 54H132L134 90H120Z M76 54H90L84 78H72Z M70 31H80V36H70Z',
  knife: 'M22 58L84 50Q90 50 90 56V62Q90 66 84 66L26 70Q18 70 18 64Q18 58 22 58Z M88 44H96V72H88Z M96 50Q150 40 200 52Q222 58 226 64Q200 76 150 70Q120 66 96 66Z'
};
const RAR = {
  milspec: ['#4B69FF', 'rgba(75,105,255,0.30)'], restricted: ['#8847FF', 'rgba(136,71,255,0.32)'],
  classified: ['#D32CE6', 'rgba(211,44,230,0.30)'], covert: ['#EB4B4B', 'rgba(235,75,75,0.32)'], gold: ['#E4AE39', 'rgba(228,174,57,0.38)']
};
const A = [
  ['Glock-18', 'Umbral Rabbit', 'restricted', 'pistol', false, 290, 6, 54],
  ['M4A4', 'Temukau', 'covert', 'rifle', false, 3150, 9, 102],
  ['AWP', 'Duality', 'classified', 'sniper', false, 940, 4, 2292],
  ['AK-47', 'Head Shot', 'covert', 'rifle', true, 5600, 12, 3840],
  ['USP-S', 'Jawbreaker', 'classified', 'pistol', false, 610, 3, 7260],
  ['UMP-45', 'Wild Child', 'classified', 'smg', false, 410, 5, 11000],
  ['★ Falchion Knife', 'Slaughter', 'gold', 'knife', false, 14200, 21, 18720],
  ['P2000', 'Wicked Sick', 'classified', 'pistol', false, 700, 2, 25300]
];
function pad(n) { return n < 10 ? '0' + n : String(n); }
function timer(s) {
  if (s <= 0) return 'Ended';
  if (s < 3600) return pad(Math.floor(s / 60)) + ':' + pad(s % 60);
  return Math.floor(s / 3600) + 'h ' + pad(Math.floor((s % 3600) / 60)) + 'm';
}
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { t: 0 }; this.iv = null; }
  componentDidMount() { this.iv = setInterval(() => this.setState({ t: this.state.t + 1 }), 1000); }
  componentWillUnmount() { clearInterval(this.iv); }
  renderVals() {
    const t = this.state.t;
    return {
      tabs: TABS.map((x) => ({ label: x[1], href: x[2], icon: x[3], current: x[0] === 'more' ? 'page' : undefined, color: x[0] === 'more' ? '#ECEDEF' : '#858B94' })),
      chips: [['All', '#ECEDEF', true], ['Mil-Spec', '#4B69FF'], ['Restricted', '#8847FF'], ['Classified', '#D32CE6'], ['Covert', '#EB4B4B'], ['★', '#E4AE39']].map((c) => ({
        label: c[0], color: c[1], on: !!c[2],
        style: c[2] ? 'background: #1E2227; color: #ECEDEF; border: 1px solid #ECEDEF' : 'background: transparent; color: #A1A7AF; border: 1px solid #2C3138'
      })),
      rows: A.map((a) => {
        const left = Math.max(0, a[7] - t);
        const urgent = left > 0 && left <= 120;
        return {
          weapon: a[0], skin: a[1], full: a[0] + ' | ' + a[1], color: RAR[a[2]][0], glow: RAR[a[2]][1], art: ART[a[3]],
          fill: a[2] === 'gold' ? '#EFE6D2' : '#D3D6DB', st: a[4],
          bid: a[5].toLocaleString('en-US'), bidsLabel: a[6] + ' bids',
          timer: timer(left), urgent,
          timerStyle: urgent ? 'background: #ECEDEF; color: #0A0B0D' : left === 0 ? 'color: #858B94; border: 1px dashed #2C3138' : 'color: #ECEDEF; border: 1px solid #2C3138'
        };
      })
    };
  }
}
</script>
</body>
</html>
