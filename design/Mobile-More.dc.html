<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mint — More (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0B0D}
a{color:#ECEDEF}a:hover{color:#FFFFFF}
.mono{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-variant-numeric:tabular-nums}
.lbl{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#858B94}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0A0B0D; color: #ECEDEF; font-family: 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif">

<div style="position: absolute; left: 0; right: 0; top: 0; bottom: 84px; overflow-y: auto; box-sizing: border-box; padding-top: 50px">
<header style="display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 20px">
<a href="Mobile-Home.dc.html" aria-label="Mint, home" style="display: flex; align-items: center; gap: 10px; height: 44px; text-decoration: none; color: #ECEDEF">
<span aria-hidden="true" style="width: 14px; height: 14px; background: #ECEDEF; clip-path: polygon(0 0, 100% 0, 100% 62%, 62% 100%, 0 100%)"></span>
<span class="mono" style="font-size: 14px; font-weight: 600; letter-spacing: 0.34em">MINT</span>
</a>
<span class="mono" style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid #2C3138; border-radius: 2px; font-size: 13px">4,870 <span style="color: #A1A7AF">CR</span></span>
</header>

<div style="display: flex; flex-direction: column; gap: 24px; padding: 16px 20px 32px">
<a href="Mobile-Profile.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 16px; border: 1px solid #1C1F24; border-radius: 6px; background: #0E1013; color: #ECEDEF; text-decoration: none">
<span aria-hidden="true" style="flex: none; width: 48px; height: 48px; border-radius: 50%; background: #1A1D22; display: grid; place-items: center; font-size: 18px; font-weight: 600">V</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 17px; font-weight: 600">vex</span><span class="mono" style="font-size: 12px; color: #A1A7AF">#18 by value · #7 by albums</span></span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" style="fill: none; stroke: #858B94; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round"><path d="M9 6l6 6-6 6"></path></svg>
</a>

<nav aria-label="More sections" style="display: flex; flex-direction: column">
<span class="lbl" style="padding-bottom: 8px">// Play together</span>
<sc-for list="{{links}}" as="l" hint-placeholder-count="5">
<a href="{{l.href}}" style="display: flex; align-items: center; gap: 14px; min-height: 56px; border-top: 1px solid #1A1D22; color: #ECEDEF; text-decoration: none">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" style="flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round"><path d="{{l.icon}}"></path></svg>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 500">{{l.label}}</span><span style="font-size: 12px; color: #A1A7AF">{{l.hint}}</span></span>
<sc-if value="{{l.hasCount}}" hint-placeholder-val="{{ false }}"><span class="mono" style="min-width: 22px; height: 22px; padding: 0 7px; box-sizing: border-box; border-radius: 11px; background: #ECEDEF; color: #0A0B0D; font-size: 12px; font-weight: 600; display: grid; place-items: center">{{l.count}}</span></sc-if>
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" style="flex: none; fill: none; stroke: #858B94; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round"><path d="M9 6l6 6-6 6"></path></svg>
</a>
</sc-for>
</nav>

<section aria-labelledby="acc" style="display: flex; flex-direction: column">
<h2 id="acc" class="lbl" style="margin: 0; padding-bottom: 8px">// Account</h2>
<div style="display: flex; align-items: center; justify-content: space-between; min-height: 56px; border-top: 1px solid #1A1D22"><span style="font-size: 15px">Discord</span><span style="font-size: 13px; color: #A1A7AF">Signed in as vex</span></div>
<a href="#" style="display: flex; align-items: center; min-height: 56px; border-top: 1px solid #1A1D22; color: #A1A7AF; text-decoration: none; font-size: 15px">Sign out</a>
</section>
</div>
</div>

<nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 6px 6px 24px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #0D0E11; border-top: 1px solid #1C1F24">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<a href="{{t.href}}" aria-current="{{t.current}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 50px; text-decoration: none; font-size: 11px; font-weight: 500; color: {{t.color}}">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round"><path d="{{t.icon}}"></path></svg>
<span>{{t.label}}</span>
</a>
</sc-for>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const TABS = [
  ['home', 'Home', 'Mobile-Home.dc.html', 'M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z'],
  ['cases', 'Cases', 'Mobile-Cases.dc.html', 'M3 8h18v12H3zM3 12h18M10 12v3h4v-3M8 8V5h8v3'],
  ['inventory', 'Inventory', 'Mobile-Inventory.dc.html', 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z'],
  ['albums', 'Albums', 'Mobile-Album.dc.html', 'M8 3h12v14H8zM4 7v14h12'],
  ['more', 'More', 'Mobile-More.dc.html', 'M4 6h16M4 12h16M4 18h16']
];
class Component extends DCLogic {
  renderVals() {
    return {
      tabs: TABS.map((t) => ({ label: t[1], href: t[2], icon: t[3], current: t[0] === 'more' ? 'page' : undefined, color: t[0] === 'more' ? '#ECEDEF' : '#858B94' })),
      links: [
        ['Market', 'Auctions, your listings and bids', 'Mobile-Market.dc.html', 'M3 12V3h9l9 9-9 9zM7 7h1v1H7z', 0],
        ['Trades', 'Offers from and to your friends', 'Mobile-Trades.dc.html', 'M4 8h15l-4-4M20 16H5l4 4', 2],
        ['Trade-up', '10 skins in, 1 rarer skin out', 'Mobile-TradeUp.dc.html', 'M12 20V5M6 11l6-6 6 6M5 20h14', 0],
        ['Friends', 'Requests, search by name', 'Mobile-Friends.dc.html', 'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21v-1a7 7 0 0 1 14 0v1M16 3.5a4 4 0 0 1 0 7.5M22 21v-1a7 7 0 0 0-4-6.3', 2],
        ['Leaderboard', 'Inventory value and albums', 'Mobile-Leaderboard.dc.html', 'M4 20V10h4v10M10 20V4h4v16M16 20v-7h4v7', 0]
      ].map((l) => ({ label: l[0], hint: l[1], href: l[2], icon: l[3], hasCount: l[4] > 0, count: String(l[4]) }))
    };
  }
}
</script>
</body>
</html>
