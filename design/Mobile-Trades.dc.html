<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mint — Trades (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0B0D}
a{color:#ECEDEF}a:hover{color:#FFFFFF}
.mono{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-variant-numeric:tabular-nums}
.lbl{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#858B94}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0A0B0D; color: #ECEDEF; font-family: 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif">

<div style="position: absolute; left: 0; right: 0; top: 0; bottom: 84px; overflow-y: auto; box-sizing: border-box; padding-top: 50px">
<header style="display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 8px">
<a href="Mobile-More.dc.html" style="display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 12px; color: #A1A7AF; text-decoration: none; font-size: 14px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round"><path d="M15 6l-6 6 6 6"></path></svg>More</a>
<a href="Mobile-TradeNew.dc.html" style="display: inline-flex; align-items: center; height: 36px; padding: 0 14px; margin-right: 12px; background: #ECEDEF; color: #0A0B0D; text-decoration: none; font-size: 14px; font-weight: 600; border-radius: 2px">New offer</a>
</header>

<div style="display: flex; flex-direction: column; gap: 18px; padding: 8px 20px 32px">
<h1 style="margin: 0; font-size: 32px; line-height: 1.05; font-weight: 600; letter-spacing: -0.02em">Trades</h1>

<div role="tablist" aria-label="Offers" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border: 1px solid #1C1F24; border-radius: 4px; background: #0E1013">
<button type="button" role="tab" aria-selected="true" style="height: 40px; border: 0; border-radius: 2px; background: #ECEDEF; color: #0A0B0D; font: inherit; font-size: 14px; font-weight: 600">Received · 2</button>
<button type="button" role="tab" aria-selected="false" style="height: 40px; border: 0; border-radius: 2px; background: transparent; color: #A1A7AF; font: inherit; font-size: 14px; font-weight: 500">Sent · 1</button>
<button type="button" role="tab" aria-selected="false" style="height: 40px; border: 0; border-radius: 2px; background: transparent; color: #A1A7AF; font: inherit; font-size: 14px; font-weight: 500">History</button>
</div>

<sc-for list="{{offers}}" as="o" hint-placeholder-count="2">
<article aria-label="Offer from {{o.who}}" style="display: flex; flex-direction: column; border: 1px solid #1C1F24; border-radius: 6px; background: #0E1013">
<header style="display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid #1A1D22">
<span aria-hidden="true" style="flex: none; width: 30px; height: 30px; border-radius: 50%; background: #1A1D22; display: grid; place-items: center; font-size: 12px; font-weight: 600">{{o.initial}}</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 15px; font-weight: 600">{{o.who}}</span><span class="mono" style="font-size: 11px; color: #858B94">{{o.when}}</span></span>
<span class="lbl" style="padding: 4px 7px; border: 1px solid #2C3138; border-radius: 2px; font-size: 10px; color: #ECEDEF">Pending</span>
</header>
<sc-for list="{{o.sides}}" as="s" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-bottom: 1px solid #1A1D22">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span class="lbl" style="font-size: 10px">{{s.label}}</span><span class="mono" style="font-size: 12px; color: #A1A7AF">≈ {{s.total}} CR</span></div>
<sc-for list="{{s.items}}" as="it" hint-placeholder-count="1">
<div style="position: relative; display: flex; align-items: center; gap: 10px; padding: 6px 10px 8px 6px; background: #121417; border: 1px solid #1C1F24; border-radius: 4px; overflow: hidden">
<span style="position: relative; flex: none; width: 60px; height: 34px; display: grid; place-items: center"><span aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(closest-side, {{it.glow}}, rgba(0,0,0,0))"></span><svg role="img" aria-label="{{it.full}} (placeholder art)" viewBox="0 0 240 100" style="position: relative; width: 100%; fill: #D3D6DB"><path d="{{it.art}}"></path></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.full}}</span><span class="mono" style="font-size: 10px; color: #A1A7AF">{{it.meta}}</span></span>
<sc-if value="{{it.album}}" hint-placeholder-val="{{ false }}"><span class="lbl" style="font-size: 8px; color: #ECEDEF">Album +1</span></sc-if>
<span aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: {{it.color}}"></span>
</div>
</sc-for>
</div>
</sc-for>
<footer style="display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 16px">
<span class="mono" style="font-size: 12px; color: #A1A7AF">{{o.balance}}</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button type="button" style="height: 44px; border: 0; background: none; color: #A1A7AF; font: inherit; font-size: 14px">Decline</button>
<a href="Mobile-TradeNew.dc.html" style="display: flex; align-items: center; justify-content: center; height: 44px; border: 1px solid #2C3138; border-radius: 2px; color: #ECEDEF; text-decoration: none; font-size: 14px">Counter</a>
<button type="button" style="height: 44px; border: 0; border-radius: 2px; background: #ECEDEF; color: #0A0B0D; font: inherit; font-size: 14px; font-weight: 600">Accept</button>
</div>
</footer>
</article>
</sc-for>
</div>
</div>

<nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 6px 6px 24px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #0D0E11; border-top: 1px solid #1C1F24">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<a href="{{t.href}}" aria-current="{{t.current}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 50px; text-decoration: none; font-size: 11px; font-weight: 500; color: {{t.color}}">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round"><path d="{{t.icon}}"></path></svg>
<span>{{t.label}}</span>
</a>
</sc-for>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const TABS = [
  ['home', 'Home', 'Mobile-Home.dc.html', 'M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z'],
  ['cases', 'Cases', 'Mobile-Cases.dc.html', 'M3 8h18v12H3zM3 12h18M10 12v3h4v-3M8 8V5h8v3'],
  ['inventory', 'Inventory', 'Mobile-Inventory.dc.html', 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z'],
  ['albums', 'Albums', 'Mobile-Album.dc.html', 'M8 3h12v14H8zM4 7v14h12'],
  ['more', 'More', 'Mobile-More.dc.html', 'M4 6h16M4 12h16M4 18h16']
];
const ART = {
  rifle: 'M10 46L58 38L60 52L18 66Q10 67 10 60Z M56 35H150V52H56Z M70 30H140V35H70Z M150 38H196V50H150Z M196 42H232V46H196Z M186 32H191V38H186Z M112 52H128Q131 68 140 82L124 86Q116 70 112 52Z M80 52H94L88 76H76Z',
  pistol: 'M70 30H182V46H70Z M74 46H176V54H120V58H74Z M76 54H108L100 88Q99 92 94 92H70Q64 92 66 86Z M108 56Q110 68 122 68V64Q114 64 112 56Z M182 34H188V42H182Z',
  smg: 'M60 36H160V54H60Z M160 42H200V47H160Z M20 40H60V44H28V56H60V60H20Z M118 54H132L134 90H120Z M76 54H90L84 78H72Z M70 31H80V36H70Z'
};
const RAR = {
  milspec: ['#4B69FF', 'rgba(75,105,255,0.30)'], restricted: ['#8847FF', 'rgba(136,71,255,0.32)'],
  classified: ['#D32CE6', 'rgba(211,44,230,0.30)'], covert: ['#EB4B4B', 'rgba(235,75,75,0.32)']
};
function it(w, s, r, a, m, album) { return { full: w + ' | ' + s, color: RAR[r][0], glow: RAR[r][1], art: ART[a], meta: m, album: !!album }; }
class Component extends DCLogic {
  renderVals() {
    return {
      tabs: TABS.map((t) => ({ label: t[1], href: t[2], icon: t[3], current: t[0] === 'more' ? 'page' : undefined, color: t[0] === 'more' ? '#ECEDEF' : '#858B94' })),
      offers: [
        {
          who: 'kenji', initial: 'K', when: 'Expires in 2 d 04 h', balance: 'Estimated +500 CR for you',
          sides: [
            { label: 'You give', total: '2,500', items: [it('AK-47', 'Inheritance', 'covert', 'rifle', 'FT · 0.2381')] },
            { label: 'You get', total: '3,000', items: [it('M4A4', 'Temukau', 'covert', 'rifle', 'MW · 0.0871')] }
          ]
        },
        {
          who: 'rhea', initial: 'R', when: 'Expires in 18 h', balance: 'Estimated +230 CR · fills 1 album slot',
          sides: [
            { label: 'You give', total: '270', items: [it('Glock-18', 'Block-18', 'restricted', 'pistol', 'ST™ · FT · 0.1876'), it('MAC-10', 'Light Box', 'milspec', 'smg', 'FT · 0.3121')] },
            { label: 'You get', total: '500', items: [it('Zeus x27', 'Olympus', 'classified', 'pistol', 'FT · 0.2650', true)] }
          ]
        }
      ]
    };
  }
}
</script>
</body>
</html>
